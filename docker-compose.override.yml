# 로컬 개발용 오버라이드 — docker compose up 시 자동 병합됨
# 포트 직접 노출 + 볼륨 바인드 마운트으로 핫리로드/디버깅 지원

name: mind-palette

services:
  preprocess-server:
    ports:
      - "8081:8081"

  ai-server:
    ports:
      - "8082:8082"

  api-gateway:
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "development"
      KEEP_IMAGES: "true"

  frontend:
    ports:
      - "5173:80"

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl-local:/etc/nginx/ssl:ro
