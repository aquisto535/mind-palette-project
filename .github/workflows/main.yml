name: Mind Palette CI/CD

# 트리거: main 브랜치에 푸시되거나 PR이 생성될 때 실행
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Node.js (API Gateway) CI
  backend-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: api-gateway/package-lock.json
        
    - name: Install Dependencies (Backend)
      working-directory: ./api-gateway
      run: npm ci
      
    - name: Run Tests (Backend)
      working-directory: ./api-gateway
      run: npm test

  # 2. React (Frontend) CI
  frontend-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install Dependencies (Frontend)
      working-directory: ./frontend
      run: npm ci
      
    - name: Run Tests (Frontend)
      working-directory: ./frontend
      run: npm test

    - name: Build (Frontend)
      working-directory: ./frontend
      run: npm run build

  # 3. Integration Test (Frontend -> Backend)
  integration-test:
    needs: [backend-ci, frontend-ci] # 단위 테스트가 통과해야 실행
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install Dependencies & Start Backend
      working-directory: ./api-gateway
      run: |
        npm ci
        npm run build
        npm start &
        sleep 5 # 서버 시작 대기
        
    # 통합 테스트 스크립트 실행 (Jest 사용)
    - name: Run Integration Tests
      working-directory: ./api-gateway
      run: |
        npm ci
        npm test tests/integration.test.ts
  # 4. C++ Preprocess Server CI
  preprocess-ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          pkg-config \
          build-essential \
          curl \
          zip \
          unzip \
          tar \
          libx11-dev \
          libxft-dev \
          libxext-dev \
          libwayland-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxdamage-dev \
          libxinerama-dev \
          autoconf \
          automake \
          libtool \
          python3-pip \
          python3-setuptools
        sudo pip3 install meson

    - name: Restore vcpkg artifacts
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/vcpkg/archives
          ${{ env.VCPKG_ROOT }}
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('preprocess-server/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/vcpkg
        vcpkgJsonGlob: 'preprocess-server/vcpkg.json'

    - name: Configure CMake
      run: |
        cmake -S preprocess-server -B preprocess-server/build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build preprocess-server/build

    - name: Run Tests
      working-directory: preprocess-server/build
      run: ctest --output-on-failure

  # 5. Security Analysis (CodeQL)
  # JavaScript/TypeScript 및 C++ 코드의 보안 취약점을 분석합니다.
  security-analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies (for C++ Analysis)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          pkg-config \
          build-essential \
          curl \
          zip \
          unzip \
          tar \
          libx11-dev \
          libxft-dev \
          libxext-dev \
          libwayland-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxdamage-dev \
          libxinerama-dev \
          autoconf \
          automake \
          libtool \
          python3-pip \
          python3-setuptools
        sudo pip3 install meson



    - name: Setup vcpkg (for C++ Analysis)
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/vcpkg
        vcpkgJsonGlob: 'preprocess-server/vcpkg.json'

    - name: Restore vcpkg artifacts (for Analysis)
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/vcpkg/archives
          ${{ env.VCPKG_ROOT }}
        key: ${{ runner.os }}-vcpkg-analysis-${{ hashFiles('preprocess-server/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-analysis-

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript, c-cpp

    - name: Configure CMake (for Analysis)
      run: |
        cmake -S preprocess-server -B preprocess-server/build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build (for Analysis)
      run: cmake --build preprocess-server/build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
