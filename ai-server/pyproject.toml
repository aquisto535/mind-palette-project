[project]
name = "mind-palette-ai-server"
version = "0.1.0"
description = "HFD (Human Figure Drawing) AI inference server for Mind Palette"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "tqdm>=4.66.0",
    "onnx>=1.15.0",
    "onnxruntime-gpu>=1.19.0",
    "onnxscript>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
gpu = [
    "tensorrt-cu12>=10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # PyTorch 내부 pytree 구현 변경으로 인한 경고 — 우리 코드 밖에서 발생
    "ignore::FutureWarning:copyreg",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
